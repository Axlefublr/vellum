draw_on = "all"
default_tool = "pen"
remember_last_tool = true
stroke_size = 5
default_color = "#E84046"
feedback_duration_ms = 500
clear_on_escape = false
default_fill_shapes = false
size_range = { min = 1, max = 100, step = 1, stops = [] }

palette = [
  "#E84046",
  "#EF8F4F",
  "#EED14D",
  "#4DD54F",
  "#0483FA",
  "#7C58EA",
  "#EBEBEB",
  "#141414",
]

[tools]
eraser.size = 10
pen = { opacity = 1, roundness = 1 }
line = { opacity = 1, roundness = 0.5 }
arrow = { opacity = 1, roundness = 0.25 }
ellipse = { opacity = 1, filled = false }
triangle = { opacity = 1, roundness = 0.0, filled = false }
rectangle = { opacity = 1, roundness = 0.01, filled = false }

[tools.text]
size = 16
opacity = 1
roundness = 0.1
background = false
font = { family = "sans-serif", weight = 400, style = "normal", features = {} }
size_range = { min = 8, max = 500, step = 0.5 }
